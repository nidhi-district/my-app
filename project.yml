name: Hello
options:
  bundleIdPrefix: com.hello
  deploymentTarget:
    iOS: "17.0"
targets:
  Hello:
    type: application
    platform: iOS
    sources:
      - Hello
      - HelloWidget/WidgetPad.swift
    entitlements:
      path: Hello/Hello.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nidhisingh.hello
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nidhisingh.hello
        DEVELOPMENT_TEAM: VK5TUTFVRS
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: HelloWidget
  HelloWidget:
    type: app-extension
    platform: iOS
    sources:
      - HelloWidget
      - Hello/Theme.swift
      - Hello/NoteDecorations.swift
      - Hello/Fonts
      - Hello/Assets.xcassets
    entitlements:
      path: HelloWidget/HelloWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nidhisingh.hello
    info:
      path: HelloWidget/Info.plist
      properties:
        CFBundleDisplayName: Hello
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nidhisingh.hello.widget
        DEVELOPMENT_TEAM: VK5TUTFVRS
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  HelloUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HelloUITests]
    dependencies:
      - target: Hello
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nidhisingh.hello.uitests
        DEVELOPMENT_TEAM: VK5TUTFVRS
schemes:
  Hello:
    build:
      targets:
        Hello: all
        HelloUITests: [test]
    test:
      targets: [HelloUITests]
